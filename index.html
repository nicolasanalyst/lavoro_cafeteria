<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavoro Cafeteria - Menu Digital</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Google: Poppins para títulos e Open Sans para leitura -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            50: '#fcfaf8',
                            100: '#f5f0eb',
                            200: '#e6dcd3',
                            300: '#d1bea8',
                            400: '#b89c7d',
                            500: '#a37f59',
                            600: '#8c6645',
                            700: '#735139', // Cor principal
                            800: '#5e4333',
                            900: '#4d382d',
                        },
                        cream: '#F9F5F0'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Lato"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F9F5F0;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Animação suave para o modal */
        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 300ms ease-out, transform 300ms ease-out;
        }
        .modal-exit {
            opacity: 1;
            transform: scale(1);
        }
        .modal-exit-active {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 200ms ease-in, transform 200ms ease-in;
        }
    </style>
</head>
<body class="font-sans text-coffee-900 antialiased selection:bg-coffee-200">

    <!-- Navbar Fixa -->
    <nav class="fixed w-full z-40 bg-coffee-900/95 backdrop-blur-sm text-cream shadow-lg transition-all duration-300">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-center h-16">
                <span class="font-serif text-xl tracking-wider font-bold">Lavoro Bourbon</span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative pt-32 pb-12 px-4 sm:px-6 lg:px-8 bg-coffee-800 text-center overflow-hidden">
        <!-- Imagem de fundo -->
        <img 
            src="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&q=80" 
            alt="Ambiente da Cafeteria" 
            class="absolute inset-0 w-full h-full object-cover opacity-20 mix-blend-overlay"
        >
        
        <div class="relative max-w-3xl mx-auto z-10 flex flex-col items-center">
            
            <!-- Logo grande centralizada -->
            <img 
                src="img/logo.png" 
                alt="Logo Lavoro" 
                class="h-32 w-32 rounded-full border-4 border-coffee-300 object-cover mb-6 shadow-xl bg-coffee-100"
                onerror="this.src='https://placehold.co/200x200/e6dcd3/735139?text=Lavoro'"
            >

            <h1 class="text-3xl sm:text-5xl font-serif text-cream mb-4 font-bold leading-tight">
                O sabor pensado pra você
            </h1>
            <p class="text-coffee-100 text-lg mb-6 font-light">
                Explore nosso guia e aproveite!
            </p>
        </div>
    </header>

    <!-- Filtros de Categoria -->
    <div class="sticky top-16 z-30 bg-cream/95 backdrop-blur shadow-sm border-b border-coffee-200">
        <div class="max-w-5xl mx-auto px-4 py-4 overflow-x-auto hide-scrollbar">
            <div class="flex space-x-2" id="category-filters">
                <!-- Botões gerados via JS -->
            </div>
        </div>
    </div>

    <!-- Grid de Produtos -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 min-h-screen">
        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards gerados via JS -->
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-coffee-900 text-coffee-200 py-12 px-4 text-center">
        <div class="max-w-xl mx-auto">
            <h3 class="font-serif text-2xl text-cream mb-4">Lavoro Cafeteria</h3>
            <p class="mb-6 text-sm">A arte do café no coração de Araras.</p>
            
            <div class="flex justify-center gap-6 mb-8">
                <a href="#" class="hover:text-white transition"><i data-lucide="instagram"></i></a>
                <a href="#" class="hover:text-white transition"><i data-lucide="facebook"></i></a>
                <a href="#" class="hover:text-white transition"><i data-lucide="map-pin"></i></a>
            </div>
            
            <div class="text-xs opacity-60">
                <p>&copy; 2024 Lavoro Cafeteria. Todos os direitos reservados.</p>
                <p class="mt-2">Imagens ilustrativas.</p>
            </div>
        </div>
    </footer>

    <!-- Modal de Detalhes -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-coffee-900/80 backdrop-blur-sm transition-opacity" id="modal-backdrop" onclick="closeModal()"></div>

        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                
                <!-- Painel do Modal -->
                <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-coffee-100">
                    
                    <!-- Botão Fechar -->
                    <button onclick="closeModal()" class="absolute top-4 right-4 z-10 p-2 rounded-full bg-black/20 text-white hover:bg-black/40 transition backdrop-blur-sm">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>

                    <!-- Imagem do Modal -->
                    <div class="relative h-64 w-full overflow-hidden bg-coffee-100">
                        <img 
                            id="modal-image" 
                            src="" 
                            alt="Imagem do Produto" 
                            class="h-full w-full object-cover"
                        >
                        <div class="absolute bottom-0 left-0 w-full h-24 bg-gradient-to-t from-black/80 to-transparent"></div>
                        <h2 id="modal-title" class="absolute bottom-4 left-6 text-3xl font-serif font-bold text-white drop-shadow-md"></h2>
                    </div>

                    <!-- Conteúdo do Modal -->
                    <div class="px-6 py-6 bg-white">
                        
                        <!-- Tags -->
                        <div class="flex items-center gap-2 mb-4">
                            <span id="modal-category" class="px-3 py-1 bg-coffee-100 text-coffee-800 text-xs font-bold uppercase tracking-wider rounded-full"></span>
                            <span id="modal-price" class="text-lg font-bold text-coffee-600 ml-auto"></span>
                        </div>

                        <!-- Descrição Educativa -->
                        <div class="mb-6">
                            <h3 class="text-sm font-bold text-coffee-400 uppercase tracking-wide mb-2 flex items-center gap-2">
                                <i data-lucide="info" class="w-4 h-4"></i> O que é?
                            </h3>
                            <p id="modal-description" class="text-coffee-800 leading-relaxed"></p>
                        </div>

                        <!-- Composição Visual -->
                        <div class="mb-6 bg-coffee-50 p-4 rounded-xl border border-coffee-100">
                            <h3 class="text-sm font-bold text-coffee-400 uppercase tracking-wide mb-3 flex items-center gap-2">
                                <i data-lucide="layers" class="w-4 h-4"></i> Composição
                            </h3>
                            <ul id="modal-composition" class="space-y-2 text-sm text-coffee-700">
                                <!-- Lista de ingredientes -->
                            </ul>
                        </div>

                        <!-- Intensidade (ID adicionado para controle via JS) -->
                        <div id="modal-intensity-section" class="mb-6">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm font-bold text-coffee-400 uppercase tracking-wide">Intensidade</span>
                                <span id="modal-intensity-text" class="text-xs font-bold text-coffee-600">Forte</span>
                            </div>
                            <div class="w-full bg-coffee-100 rounded-full h-2.5">
                                <div id="modal-intensity-bar" class="bg-coffee-600 h-2.5 rounded-full" style="width: 70%"></div>
                            </div>
                        </div>

                        <!-- Botão Ação -->
                        <div class="mt-6">
                            <button onclick="closeModal()" class="w-full py-3 px-4 bg-coffee-800 hover:bg-coffee-700 text-white font-bold rounded-xl transition shadow-lg shadow-coffee-800/20 flex items-center justify-center gap-2">
                                <i data-lucide="check"></i>
                                Entendi, quero experimentar!
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts da Aplicação -->
    <script>
        // Dados do Menu
        // NOTA: Intensidade foi removida dos pratos (Quiche, Pão de Queijo, Cannoli)
        const menuData = [
            {
                id: 1,
                name: "Espresso",
                category: "Os mais pedidos",
                price: "R$ 7,90",
                description: "A forma mais pura e intensa do café. Extraído sob alta pressão, apresenta aroma marcante, corpo encorpado e uma crema dourada na superfície, revelando toda a complexidade dos grãos selecionados.",
                composition: ["Café moído na hora", "Água quente sob pressão"],
                intensity: 5,
                image: "https://images.unsplash.com/photo-1610889556528-9a770e32642f?auto=format&fit=crop&q=80&w=800"
            },
            {
                id: 2,
                name: "Quiche Quatro Queijos",
                category: "Receitas da Casa",
                price: "R$ 14,90",
                description: "Uma torta salgada de origem francesa, preparada com base de massa amanteigada e recheio cremoso à base de ovos, creme de leite e uma seleção especial de queijos. Rica em sabor e perfeita para qualquer momento do dia.",
                composition: ["Massa amanteigada", "Mussarela", "Parmesão", "Gorgonzola", "Queijo Prato", "Creme de leite", "Temperos finos"],
                // Sem intensidade para comida
                image: "img/prato.jpeg"
            },
            {
                id: 3,
                name: "Cappuccino Italiano",
                category: "Os mais pedidos",
                price: "R$ 12,00",
                description: "O verdadeiro clássico, sem chocolate ou canela na receita original (mas podemos adicionar!). O segredo é o equilíbrio perfeito de terços.",
                composition: ["1/3 Espresso", "1/3 Leite Vaporizado", "1/3 Espuma de Leite Densa"],
                intensity: 3,
                image: "https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&q=80&w=800"
            },
            {
                id: 5,
                name: "Pão de Queijo",
                category: "Café da Manhã",
                price: "R$ 7,90",
                description: "'Um clássico da culinária brasileira, preparado com massa macia por dentro e levemente crocante por fora. Feito à base de polvilho e queijo, é ideal para acompanhar cafés e bebidas quentes em qualquer momento do dia.",
                composition: ["Polvilho", "Queijo", "Leite", "Ovos", "Óleo", "Sal"],
                // Sem intensidade para comida
                image: "img/pãoqueijo.jpeg"
            },
            {
                id: 8,
                name: "Mocha",
                category: "Bebidas",
                price: "R$ 15,00",
                description: "Para quem ama chocolate. Uma combinação envolvente de café expresso com leite vaporizado e uma generosa calda de chocolate, resultando em uma bebida cremosa, adocicada e cheia de personalidade.",
                composition: ["Calda de chocolate", "Café expresso", "Leite vaporizado", "Chantilly"],
                intensity: 4,
                image: "img/mocha.jpeg"
            },
            {
                id: 9,
                name: "Cannoli",
                category: "Sobremesas",
                price: "R$ 7,90",
                description: "Uma clássica sobremesa italiana feita com massa crocante em formato de tubo, recheada com um creme suave e delicadamente adocicado. Uma combinação perfeita entre textura e sabor, ideal para quem aprecia doces refinados e artesanais.",
                composition: ["Massa crocante artesanal","Açúcar de confeiteiro", "Doce de leite"],
                // Sem intensidade para comida
                image: "img/sobremesa.jpeg"
            }
        ];

        // Estado da Aplicação
        let activeCategory = 'Os mais pedidos';

        // Elementos DOM
        const grid = document.getElementById('menu-grid');
        const filtersContainer = document.getElementById('category-filters');
        const modal = document.getElementById('product-modal');

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderFilters();
            renderGrid();
        });

        // Renderiza os botões de filtro
        function renderFilters() {
            const categories = [
                'Os mais pedidos',
                'Receitas da Casa',
                'Café da Manhã',
                'Sobremesas',
                'Bebidas'
            ];
            
            filtersContainer.innerHTML = categories.map(cat => `
                <button 
                    onclick="setCategory('${cat}')"
                    class="px-5 py-2 rounded-full text-sm font-bold transition whitespace-nowrap ${
                        activeCategory === cat 
                        ? 'bg-coffee-800 text-white shadow-md' 
                        : 'bg-white text-coffee-600 border border-coffee-200 hover:bg-coffee-50'
                    }"
                >
                    ${cat}
                </button>
            `).join('');
        }

        // Filtra e atualiza a grid
        function setCategory(cat) {
            activeCategory = cat;
            renderFilters();
            renderGrid();
        }

        // Renderiza os cards de produto
        function renderGrid() {
            const filteredData = menuData.filter(item => item.category === activeCategory);

            if (filteredData.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-10 text-coffee-400">
                        <p>Nenhum item encontrado nesta categoria.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredData.map(item => `
                <div 
                    onclick="openModal(${item.id}, this)"
                    class="group bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer border border-coffee-100 overflow-hidden flex flex-col"
                >
                    <div class="h-48 overflow-hidden relative">
                        <img 
                            src="${item.image}" 
                            alt="${item.name}" 
                            class="w-full h-full object-cover transform group-hover:scale-110 transition duration-700"
                            onerror="this.src='https://placehold.co/600x400/e6dcd3/735139?text=Lavoro+Café'"
                        >
                        <div class="absolute bottom-2 right-2 bg-white/90 backdrop-blur px-2 py-1 rounded-lg text-xs font-bold text-coffee-800">
                            <i data-lucide="plus-circle" class="w-3 h-3 inline mr-1"></i>Ver detalhes
                        </div>
                    </div>
                    <div class="p-5 flex-1 flex flex-col">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-xl font-serif font-bold text-coffee-900">${item.name}</h3>
                            <span class="text-coffee-600 font-bold text-sm">${item.price}</span>
                        </div>
                        <p class="text-coffee-600 text-sm line-clamp-2 mb-4 flex-1">${item.description}</p>
                        <div class="flex items-center gap-2 text-xs text-coffee-400 font-bold uppercase tracking-wider">
                            <span>${item.category}</span>
                            ${item.intensity ? `
                                <span class="w-1 h-1 bg-coffee-300 rounded-full"></span>
                                <span>Intensidade ${item.intensity}/5</span>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        // Lógica do Modal
        function openModal(id, element) {
            const item = menuData.find(i => i.id === id);
            if (!item) return;

            // Popula os dados
            document.getElementById('modal-title').innerText = item.name;
            const modalImg = document.getElementById('modal-image');
            
            // Lógica de "pegar a imagem que já está lá" (Mantida da versão anterior)
            if (element) {
                const gridImg = element.querySelector('img');
                if (gridImg && gridImg.currentSrc) {
                     modalImg.src = gridImg.currentSrc;
                } else if (gridImg && gridImg.src) {
                     modalImg.src = gridImg.src;
                } else {
                     modalImg.src = item.image;
                }
            } else {
                modalImg.src = item.image;
            }

            document.getElementById('modal-description').innerText = item.description;
            document.getElementById('modal-category').innerText = item.category;
            document.getElementById('modal-price').innerText = item.price;
            
            // Popula composição
            const compList = document.getElementById('modal-composition');
            compList.innerHTML = item.composition.map(c => 
                `<li class="flex items-start gap-2"><div class="w-1.5 h-1.5 mt-1.5 rounded-full bg-coffee-400"></div>${c}</li>`
            ).join('');

            // Lógica da Intensidade (Mostrar/Esconder)
            const intensitySection = document.getElementById('modal-intensity-section');
            
            if (item.intensity) {
                // Se tiver intensidade (Bebidas), mostra e preenche
                intensitySection.classList.remove('hidden');
                
                const intensityPercent = (item.intensity / 5) * 100;
                const bar = document.getElementById('modal-intensity-bar');
                bar.style.width = `${intensityPercent}%`;
                
                // Texto da intensidade
                const intensityText = item.intensity <= 2 ? "Suave" : item.intensity <= 4 ? "Equilibrado" : "Intenso";
                document.getElementById('modal-intensity-text').innerText = `${intensityText} (${item.intensity}/5)`;

                // Cores da barra
                bar.className = `h-2.5 rounded-full ${
                    item.intensity >= 4 ? 'bg-coffee-800' : 'bg-coffee-500'
                }`;
            } else {
                // Se não tiver intensidade (Comida), esconde a seção
                intensitySection.classList.add('hidden');
            }

            // Mostra o modal
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.querySelector('div[class*="transform"]').classList.remove('scale-95', 'opacity-0');
            }, 10);
            
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.querySelector('div[class*="transform"]').classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 200);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
